version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    # Weekly, not daily: a daily group PR re-opened every morning (and its CI runs) was mostly noise.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    # One PR for the patch-level updates, which are drop-in. Minor and major bumps (for 0.x crates a
    # minor bump is a breaking one: jpeg-encoder 0.6 -> 0.7 removed `Density`) are left for a
    # deliberate upgrade instead of being mixed into a group PR that can't build.
    groups:
      cargo-patch:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
